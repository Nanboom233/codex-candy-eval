name: Sub2API release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Wei-Shaw/sub2api
          ref: v0.2.18
          path: upstream
          fetch-depth: 1
      - uses: actions/setup-go@v7
        with:
          go-version-file: upstream/backend/go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install frontend dependencies with the original lockfile
        working-directory: upstream/frontend
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
      - name: Check, build, and package the native administrator port
        run: python3 scripts/build.py --source upstream --check
      - uses: actions/upload-artifact@v6
        with:
          name: sub2api-codex-eval
          path: dist/build/sub2api-codex-eval-installer

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: delivery
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: sub2api-codex-eval
          path: artifacts
      - name: Publish the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/sub2api-codex-eval-installer --repo "$GITHUB_REPOSITORY" --generate-notes
